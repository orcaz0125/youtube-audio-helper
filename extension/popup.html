<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>音频下载</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:#1d1d1f;background:#f5f5f7}*{box-sizing:border-box}body{width:328px;margin:0;padding:24px}button{font:inherit;cursor:pointer;border:0}button:focus-visible,summary:focus-visible{outline:3px solid #0071e355;outline-offset:3px}.header{display:flex;align-items:center;gap:12px;margin-bottom:24px}.icon{width:42px;height:42px;border-radius:12px;background:white;border:1px solid #e8e8ed;display:grid;place-items:center;color:#0071e3}h1{font-size:19px;letter-spacing:-.5px;line-height:1.3;margin:0;font-weight:650}.subtitle{font-size:11px;color:#86868b;margin-top:4px}.primary{display:flex;justify-content:center;align-items:center;gap:7px;width:100%;height:44px;background:#0071e3;color:white;border-radius:12px;font-size:14px;font-weight:550}.primary:hover{background:#0077ed}.primary:disabled{background:#a2c5e9;cursor:default}.status{font-size:12px;line-height:1.6;color:#86868b;margin:12px 0 0;overflow-wrap:anywhere}.status:empty{display:none}.result{display:none;margin-top:16px;background:#fff;border:1px solid #e8e8ed;border-radius:14px;padding:16px}.metrics{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.label{font-size:10px;color:#86868b;letter-spacing:.6px}.value{font-size:21px;font-weight:600;letter-spacing:-.6px;margin-top:4px}.source{font-size:10px;color:#86868b;margin-top:4px}.filename{font-size:11px;color:#6e6e73;margin:14px 0 0;padding-top:12px;border-top:1px solid #f0f0f2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.text-button{background:transparent;color:#0071e3;padding:0;font-size:12px}.reveal{margin-top:14px}.footer{display:flex;align-items:center;justify-content:space-between;margin-top:22px;padding-top:14px;border-top:1px solid #e3e3e8}.connection{font-size:10px;color:#86868b;max-width:190px;line-height:1.5;overflow-wrap:anywhere}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#b7b7bd;margin-right:5px}.dot[data-state="ready"]{background:#34c759}.dot[data-state="error"]{background:#ff9500}details{margin-top:14px;color:#86868b;font-size:11px;line-height:1.7}summary{cursor:pointer;list-style:none}summary::after{content:' ＋'}details[open] summary::after{content:' −'}code{display:block;user-select:all;font-size:10px;overflow-wrap:anywhere;color:#6e6e73;margin:8px 0}.credit{margin:16px 0 0;text-align:center;font-size:10px;letter-spacing:.3px;color:#86868b}.hint{font-size:10px;line-height:1.6;color:#a1a1a6;text-align:center;margin:12px 0 0}
</style></head><body>
<div class="header"><div class="icon" aria-hidden="true"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg></div><div><h1>音频下载</h1><div class="subtitle">YouTube → Audio</div></div></div>
<button id="download" class="primary"><span id="download-label">↓ 下载音频</span></button>
<p class="hint">保存为 MP3 · 自动写入调性与 BPM</p>
<p id="status" class="status" role="status" aria-live="polite"></p>
<section id="result" class="result" aria-label="下载结果"><div class="metrics"><div><div class="label">KEY / SCALE</div><div id="key-value" class="value">—</div><div id="key-source" class="source"></div></div><div><div class="label">BPM</div><div id="bpm-value" class="value">—</div><div id="bpm-source" class="source"></div></div></div><p id="filename" class="filename"></p><button id="reveal" class="text-button reveal">打开所在文件夹 ↗</button></section>
<div class="footer"><span id="connection-status" class="connection"><i class="dot"></i>检查连接中</span><button id="check-native" class="text-button">检查连接</button></div>
<details><summary>连接帮助</summary><p>连接失败时，Windows 运行 install-windows.cmd，macOS 运行「安装本机程序.command」，程序会自动配置连接。下面的 ID 仅用于排查问题。</p><code id="extension-id"></code><p>音频保存到「音乐 / YouTube Audio」。调性由 libkeyfinder 分析整首音频。视频标注作为参考，BPM 优先读取明确标注。</p></details>
<p class="credit">work by orcaz</p>
<script src="popup.js"></script></body></html>
